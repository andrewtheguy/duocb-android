# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
APP_NAME=duocb
MAIN_ACTIVITY=com.andrewtheguy.duocb/.MainActivity
CORE_REPO=duocb
CORE_GH_REPO=andrewtheguy/duocb

# The app version (duocb.versionName/versionCode) moves independently of the
# core; a bump only rewrites the release pin, and the build derives the core
# version shown in the UI from duocb.releaseTag.
BUMP_VERSION_MODE=core-key
