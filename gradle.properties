org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The Rust core (libduocb.so, built from the sibling ../duocb repo by its
# build-android.sh and released as libduocb-android.zip). By default the app
# downloads this pinned release zip and verifies its sha256 (reproducible).
# Bump both together with scripts/bump-jnilibs.sh <tag>, which also sets the
# app versionName below. For local FFI dev set DUOCB_LOCAL_JNILIBS=1 to use
# ../duocb/dist/android/jniLibs instead (see README).
duocb.releaseTag=v0.0.45
duocb.releaseSha256=841bc0eebd5dd8b62538d20ba14724d06dad1abc0de6a196155db13405de9e3d

# App version; versionName follows the pinned duocb release (numeric part).
duocb.versionName=0.0.45
duocb.versionCode=3
